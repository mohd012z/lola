[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lola"
version = "0.1.0"
description = "Lola: security scanner, evidence core and cognitive agent runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
# Transitional flat layout: every lola_*.py module at the repo root plus
# the llm_security package stays importable until the src/ migration lands.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root (and tests/) on sys.path so bare `pytest` behaves
# exactly like `python -m pytest`.
pythonpath = [".", "tests"]
addopts = "-q"
