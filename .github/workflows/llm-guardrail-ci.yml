name: LLM Guardrail CI

on:
  push:
    branches:
      - feature/llm-guardrail-analysis
  pull_request:
    paths:
      - 'llm_security/**'
      - 'tests/test_llm_security_*.py'
      - 'fixtures/**'
      - 'scripts/llm_security_calibration_gate.py'
      - 'scripts/llm_security_calibration_report.py'
      - '.github/workflows/llm-guardrail-ci.yml'

permissions:
  contents: read

jobs:
  guardrail-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Compile guardrail modules
        run: python -m compileall -q llm_security

      - name: Run guardrail tests
        run: python -m pytest -q tests/test_llm_security_regression.py tests/test_llm_security_protocol.py tests/test_llm_security_pipeline.py tests/test_llm_security_codegraph.py tests/test_llm_security_evidence_chain.py tests/test_llm_security_calibration.py

      - name: Calibration corpus structural gate (no numeric thresholds)
        run: python scripts/llm_security_calibration_gate.py
