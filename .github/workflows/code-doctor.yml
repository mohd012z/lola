name: Lola Code Doctor

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.tsx"
      - "**.java"
      - "**.kt"
      - "**.c"
      - "**.h"
      - "**.cpp"
      - "**.hpp"
      - "**.cs"
      - "**.vb"
      - "**.vbs"
      - "**.sh"
      - "**.ps1"
      - "**.mq4"
      - "**.mq5"
      - "**.smali"
      - "**.json"
      - "**.xml"
      - "**.svg"
      - "**.css"
      - "**.html"
      - "**.yml"
      - "**.yaml"
      - "lola_code_doctor.py"
      - ".github/workflows/code-doctor.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile every Python file
        run: |
          python - <<'PY'
          import pathlib, py_compile
          bad=[]
          for p in pathlib.Path(".").rglob("*.py"):
              if ".git" in p.parts:
                  continue
              try:
                  py_compile.compile(str(p),doraise=True)
              except Exception as e:
                  bad.append((str(p),str(e)))
          for p,e in bad:
              print("FAIL",p,e)
          if bad:
              raise SystemExit(1)
          PY
      - name: Run multi-format Code Doctor
        if: success() || failure()
        run: python lola_code_doctor.py . --output code-doctor-report.json
      - name: Apply conservative hygiene repairs\n        if: always() && github.ref == 'refs/heads/main'\n        run: python lola_code_doctor.py . --fix --output code-doctor-after-fix.json || true\n      - name: Propose safe repairs as pull request\n        if: always() && github.ref == 'refs/heads/main'\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          if git diff --quiet; then\n            echo 'No safe automatic repair required.'\n            exit 0\n          fi\n          branch=code-doctor/autofix-${{ github.run_id }}\n          git config user.name 'lola-code-doctor[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git checkout -b \"$branch\"\n          git add -u\n          git commit -m 'Code Doctor: conservative source hygiene repair'\n          git push origin \"$branch\"\n          gh pr create --base main --head \"$branch\" --title 'Code Doctor: safe automatic repairs' --body 'Automated conservative text-hygiene repairs only. Semantic/compiler failures remain reported for review.'\n      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lola-code-doctor-report
          path: |\n            code-doctor-report.json\n            code-doctor-after-fix.json
          if-no-files-found: warn
