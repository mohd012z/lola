name: Lola Code Doctor

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.tsx"
      - "**.java"
      - "**.kt"
      - "**.kts"
      - "**.c"
      - "**.h"
      - "**.cpp"
      - "**.hpp"
      - "**.cs"
      - "**.vb"
      - "**.vbs"
      - "**.sh"
      - "**.ps1"
      - "**.mq4"
      - "**.mq5"
      - "**.smali"
      - "**.json"
      - "**.xml"
      - "**.svg"
      - "**.css"
      - "**.html"
      - "**.yml"
      - "**.yaml"
      - "lola_code_doctor.py"
      - "lola_bot_health.py"
      - "lola_code_specialists.py"
      - "lola_ex_fallback_bots.py"
      - "lola_extractor_dispatcher.py"
      - "lola_extractor_library.py"
      - ".github/workflows/code-doctor.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile every Python file
        run: |
          python - <<'PY'
          import pathlib, py_compile
          bad=[]
          for p in pathlib.Path(".").rglob("*.py"):
              if ".git" in p.parts:
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as e:
                  bad.append((str(p), str(e)))
          for p,e in bad:
              print("FAIL", p, e)
          if bad:
              raise SystemExit(1)
          PY

      - name: Handoff adapter tests
        if: success() || failure()
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Deep inspect Python paths and process launches
        if: success() || failure()
        run: python lola_python_path_doctor.py . --output python-path-report.json

      - name: Build workflow skeleton troubleshooting reports
        if: success() || failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lola_workflow_inspector import workflow, head, skeleton, troubleshooting
          for name, fn in (("workflow",workflow),("head",head),("skeleton",skeleton),("troubleshooting",troubleshooting)):
              Path(f"{name}-report.json").write_text(json.dumps(fn("."),indent=2),encoding="utf-8")
          PY

      - name: Run multi-format Code Doctor
        if: success() || failure()
        run: python lola_code_doctor.py . --output code-doctor-report.json

      - name: Route failures to specialist bots
        if: always()
        run: python lola_code_specialists.py code-doctor-report.json code-specialists.json || true

      - name: Run automatic bot health gate
        if: always()
        run: python lola_bot_health.py . --output bot-health-report.json

      - name: Apply conservative hygiene repairs
        if: always() && github.ref == 'refs/heads/main'
        run: python lola_code_doctor.py . --fix --output code-doctor-after-fix.json || true

      - name: Propose safe repairs as pull request
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No safe automatic repair required."
            exit 0
          fi
          branch="code-doctor/autofix-${{ github.run_id }}"
          git config user.name "lola-code-doctor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -u
          git commit -m "Code Doctor: conservative source hygiene repair"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Code Doctor: safe automatic repairs" --body "Automated conservative text-hygiene repairs only. Semantic/compiler failures remain reported for review."

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lola-code-doctor-report
          path: |
            code-doctor-report.json
            code-doctor-after-fix.json
            code-specialists.json
            python-path-report.json
            workflow-report.json
            head-report.json
            skeleton-report.json
            troubleshooting-report.json
            bot-health-report.json
          if-no-files-found: warn
