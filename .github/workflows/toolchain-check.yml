name: Toolchain smoke check

on:
  push:
    paths:
      - "toolchain.json"
      - "COGNITIVE_FABRIC.md"
      - "fixtures/tiny_beast_benchmark.example.json"
      - "lola.py"
      - "lola_sovereign_runtime.py"
      - "lola_tiny_beast_benchmark.py"
      - "lola_controlled_transfer_benchmark.py"
      - "lola_toolchain.py"
      - "lola_handoff_adapter.py"
      - "lola_code_integration.py"
      - "lola_universal_converter.py"
      - "analyze-apk.py"
      - "lola_mobile.py"
      - "lola_library.py"
      - "frida_library.py"
      - "frida_runtime.py"
      - "tests/test_*.py"
      - ".github/workflows/toolchain-check.yml"
  pull_request:
    paths:
      - "toolchain.json"
      - "COGNITIVE_FABRIC.md"
      - "fixtures/tiny_beast_benchmark.example.json"
      - "lola.py"
      - "lola_sovereign_runtime.py"
      - "lola_tiny_beast_benchmark.py"
      - "lola_controlled_transfer_benchmark.py"
      - "lola_toolchain.py"
      - "lola_handoff_adapter.py"
      - "lola_code_integration.py"
      - "lola_universal_converter.py"
      - "analyze-apk.py"
      - "lola_mobile.py"
      - "lola_library.py"
      - "frida_library.py"
      - "frida_runtime.py"
      - "tests/test_*.py"
      - ".github/workflows/toolchain-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        run: |
          python -m json.tool toolchain.json > /dev/null
          python -m json.tool fixtures/tiny_beast_benchmark.example.json > /dev/null
      - name: Compile Lola Python modules
        run: |
          python -m py_compile \
            lola.py \
            lola_sovereign_runtime.py \
            lola_tiny_beast_benchmark.py \
            lola_controlled_transfer_benchmark.py \
            lola_cognitive_transaction.py \
            lola_toolchain.py \
            lola_handoff_adapter.py \
            lola_code_integration.py \
            lola_universal_converter.py \
            analyze-apk.py \
            lola_mobile.py \
            lola_library.py \
            android_code_reader.py \
            frida_library.py \
            frida_runtime.py \
            apk_runtime_monitor.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Sovereign cognitive smoke test
        run: python lola.py --cognitive-smoke
      - name: Tiny-to-Beast harness smoke test
        run: python lola.py --tiny-beast-smoke
      - name: Controlled T2/T3 transfer benchmark
        run: python lola.py --controlled-transfer-benchmark
      - name: Toolchain status smoke test
        run: python lola_toolchain.py status