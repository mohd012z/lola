    languages: [generic]
    severity: INFO
    message: "Mail protocol/client surface found"
    metadata: {category: protocol, surface: mail-protocol, confidence: MEDIUM}
    pattern-regex: "(?i)\\b(smtp|smtps|imap|imaps|pop3|pop3s|nodemailer|imapflow)\\b"

  - id: extract-ssh-sftp-surface
    languages: [generic]
    severity: INFO
    message: "SSH/SFTP protocol surface found"
    metadata: {category: protocol, surface: remote-shell, confidence: MEDIUM}
    pattern-regex: "(?i)\\b(ssh2|node-ssh|sftp|scp|ssh://|sftp://)\\b"

  - id: extract-dns-protocol-surface
    languages: [generic]
    severity: INFO
    message: "DNS protocol/config surface found"
    metadata: {category: protocol, surface: dns, confidence: LOW}
    pattern-regex: "(?i)\\b(DNS|nameserver|resolver|CNAME|SRV)\\b"

  - id: extract-tcp-udp-socket
    languages: [javascript, typescript]
    severity: INFO
    message: "Raw TCP/UDP socket surface found"
    metadata: {category: protocol, surface: raw-socket, confidence: HIGH}
    pattern-either:
      - pattern: net.createConnection(...)
      - pattern: net.connect(...)
      - pattern: net.createServer(...)
      - pattern: dgram.createSocket(...)
      - pattern: $NET.createConnection(...)
      - pattern: $NET.connect(...)
      - pattern: $DGRAM.createSocket(...)

  - id: extract-hidden-dom
    languages: [javascript, typescript]
    severity: INFO
    message: "Hidden DOM/UI manipulation found"
    metadata: {category: hidden, surface: hidden-ui, confidence: MEDIUM}
    pattern-either:
      - pattern: $EL.hidden = true
      - pattern: $EL.style.display = "none"
      - pattern: $EL.style.visibility = "hidden"
      - pattern: $EL.setAttribute("hidden", ...)
      - pattern: $EL.setAttribute("aria-hidden", "true")

  - id: extract-hidden-html-css
    languages: [generic]
    severity: INFO
    message: "Hidden HTML/CSS surface found"
    metadata: {category: hidden, surface: hidden-ui, confidence: LOW}
    pattern-regex: "(?i)(\\shidden(?:\\s|=|>)|aria-hidden\\s*=\\s*[\\\"']true[\\\"']|display\\s*:\\s*none|visibility\\s*:\\s*hidden|opacity\\s*:\\s*0(?:[;\\s}]))"

  - id: extract-hidden-config-name
    languages: [generic]
    severity: INFO
    message: "Hidden/dot configuration or secret-file reference found"
    metadata: {category: hidden, surface: hidden-config, confidence: MEDIUM}
    pattern-regex: "(?i)(^|[\\/])\\.(env(?:\\.[A-Za-z0-9_-]+)?|npmrc|yarnrc|pypirc|netrc|dockerignore|gitignore|gitattributes|htaccess|htpasswd|ssh|aws|config)(?:$|[\\/\\s\\\"'])"

  - id: extract-sensitive-config-extension
    languages: [generic]
    severity: INFO
    message: "Sensitive configuration/key/certificate file reference found"
    metadata: {category: hidden, surface: sensitive-config, confidence: MEDIUM}
    pattern-regex: "(?i)\\b[A-Za-z0-9_.-]+\\.(pem|key|p12|pfx|jks|keystore|mobileprovision|entitlements|crt|cer|der)\\b"

  # ========================= PRIVACY / ANONYMITY EXPOSURE =========================

  - id: extract-public-ip-discovery-service
    languages: [generic]
    severity: INFO
    message: "Public-IP discovery service/reference found"
    metadata: {category: privacy, surface: privacy-ip-exposure, confidence: MEDIUM}
    pattern-regex: "(?i)\\b(api\\.ipify\\.org|ipinfo\\.io|ifconfig\\.me|icanhazip\\.com|checkip\\.amazonaws\\.com|api\\.my-ip\\.io|ipapi\\.co|ip-api\\.com|whatismyip)\\b"

  - id: extract-analytics-telemetry-sdk
    languages: [generic]
    severity: INFO
    message: "Analytics/telemetry/tracking SDK reference found"
    metadata: {category: privacy, surface: privacy-telemetry, confidence: MEDIUM}
    pattern-regex: "(?i)\\b(google-analytics|googletagmanager|gtag\\s*\\(|firebaseanalytics|mixpanel|segment\\.|amplitude|appsflyer|adjust\\.|sentry|datadog|newrelic|matomo|plausible|posthog|clarity|hotjar|facebook pixel|fbq\\s*\\()"

  - id: extract-cookie-access
    languages: [javascript, typescript]
    severity: INFO
    message: "Browser cookie access found"
    metadata: {category: privacy, surface: privacy-persistent-id, confidence: HIGH}
    pattern-either:
      - pattern: document.cookie
      - pattern: $DOC.cookie

  - id: extract-persistent-identifier-storage
    languages: [javascript, typescript]
    severity: INFO
    message: "Potential persistent identifier stored in browser storage"
    metadata: {category: privacy, surface: privacy-persistent-id, confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, $VALUE)
          - pattern: sessionStorage.setItem($KEY, $VALUE)
          - pattern: $STORE.setItem($KEY, $VALUE)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(device|user|client|visitor|fingerprint|install|session|tracking|analytics|advertising|uuid|guid|identifier|id).*

  - id: extract-fingerprinting-library
    languages: [generic]
    severity: INFO
    message: "Browser/device fingerprinting library or technique reference found"
    metadata: {category: privacy, surface: privacy-fingerprinting, confidence: MEDIUM}
    pattern-regex: "(?i)\\b(fingerprintjs|fingerprint2|clientjs|canvas fingerprint|audio fingerprint|webgl fingerprint|device fingerprint)\\b"

  - id: extract-canvas-fingerprint-surface
    languages: [javascript, typescript]
    severity: INFO
    message: "Canvas rendering/readback surface found; review if used for fingerprinting"
    metadata: {category: privacy, surface: privacy-fingerprinting, confidence: LOW}
    pattern-either:
      - pattern: $CANVAS.toDataURL(...)
      - pattern: $CTX.getImageData(...)
      - pattern: $CANVAS.toBlob(...)

  - id: extract-webgl-fingerprint-surface
    languages: [javascript, typescript]
    severity: INFO
    message: "WebGL renderer/vendor information surface found"
    metadata: {category: privacy, surface: privacy-fingerprinting, confidence: MEDIUM}
    pattern-either:
      - pattern: $GL.getParameter(...)
      - pattern: $GL.getExtension("WEBGL_debug_renderer_info")

  - id: extract-webrtc-candidate-inspection
    languages: [javascript, typescript]
    severity: INFO
    message: "WebRTC ICE candidate handling found; review local/network metadata exposure"
    metadata: {category: privacy, surface: privacy-network-exposure, confidence: MEDIUM}
    pattern-either:
      - pattern: $PC.onicecandidate = $HANDLER
      - pattern: $PC.addEventListener("icecandidate", ...)
      - pattern: $CANDIDATE.candidate

  - id: extract-advertising-device-id
    languages: [generic]
    severity: WARNING
    message: "Advertising/device identifier reference found"
    metadata: {category: privacy, surface: privacy-advertising-id, confidence: MEDIUM}
    pattern-regex: "(?i)\\b(IDFA|advertisingIdentifier|AdvertisingIdClient|advertisingId|AAID|GAID|identifierForVendor|ANDROID_ID)\\b"

  - id: extract-telemetry-user-context
    languages: [generic]
    severity: INFO
    message: "Telemetry user/device identity context reference found"
    metadata: {category: privacy, surface: privacy-telemetry, confidence: LOW}
    pattern-regex: "(?i)\\b(setUser|identify\\s*\\(|setUserId|user_id|device_id|distinct_id|anonymous_id|installation_id|client_id)\\b"

  - id: extract-cross-site-tracking-cookie-flags
    languages: [generic]
    severity: INFO
    message: "Cross-site cookie attribute reference found"
    metadata: {category: privacy, surface: privacy-cookie, confidence: LOW}
    pattern-regex: "(?i)\\b(SameSite=None|third[- ]party cookie|partitioned cookie|CHIPS)\\b"
