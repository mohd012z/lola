# Codex Security Semgrep rules
# Run: semgrep scan --config codex-security.yaml <target>
# Example: semgrep scan --config codex-security.yaml .

rules:
  # ========================= INVENTORY / EXTRACT =========================

  - id: extract-urls
    languages: [generic]
    severity: INFO
    message: "External URL/reference found"
    metadata: {category: inventory, confidence: HIGH}
    pattern-regex: "https?://[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]+"

  - id: extract-fetch-calls
    languages: [javascript, typescript]
    severity: INFO
    message: "fetch() outbound request -> $URL"
    metadata: {category: inventory, confidence: HIGH}
    pattern: fetch($URL, ...)

  - id: extract-axios-calls
    languages: [javascript, typescript]
    severity: INFO
    message: "Axios request: $METHOD -> $URL"
    metadata: {category: inventory, confidence: HIGH}
    patterns:
      - pattern: $AXIOS.$METHOD($URL, ...)
      - metavariable-regex:
          metavariable: $AXIOS
          regex: ^axios$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|request)$

  - id: extract-xhr-calls
    languages: [javascript, typescript]
    severity: INFO
    message: "XMLHttpRequest endpoint: $METHOD -> $URL"
    metadata: {category: inventory, confidence: HIGH}
    pattern: $XHR.open($METHOD, $URL, ...)

  - id: extract-websocket
    languages: [javascript, typescript]
    severity: INFO
    message: "WebSocket endpoint -> $URL"
    metadata: {category: inventory, confidence: HIGH}
    pattern: new WebSocket($URL, ...)

  - id: extract-eventsource
    languages: [javascript, typescript]
    severity: INFO
    message: "EventSource/SSE endpoint -> $URL"
    metadata: {category: inventory, confidence: HIGH}
    pattern: new EventSource($URL, ...)

  - id: extract-config-surface
    languages: [javascript, typescript]
    severity: INFO
    message: "Configuration/environment read: $KEY"
    metadata: {category: inventory, confidence: HIGH}
    pattern-either:
      - pattern: process.env.$KEY
      - pattern: process.env[$KEY]
      - pattern: import.meta.env.$KEY

  - id: extract-express-routes
    languages: [javascript, typescript]
    severity: INFO
    message: "Express-style route: $METHOD $PATH -> $HANDLER"
    metadata: {category: inventory, confidence: HIGH}
    patterns:
      - pattern: $APP.$METHOD($PATH, ..., $HANDLER)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|all|options|head)$

  - id: extract-webstorage-writes
    languages: [javascript, typescript]
    severity: INFO
    message: "Browser storage write: $STORE.setItem($KEY, ...)"
    metadata: {category: inventory, confidence: HIGH}
    patterns:
      - pattern: $STORE.setItem($KEY, $VALUE)
      - metavariable-regex:
          metavariable: $STORE
          regex: ^(localStorage|sessionStorage)$

  # ========================= DIRECT AUDIT =========================

  - id: audit-xss-sinks
    languages: [javascript, typescript]
    severity: ERROR
    message: "Potential XSS sink. Prefer textContent for text, or sanitize trusted markup before insertion."
    metadata: {category: security, cwe: "CWE-79", confidence: MEDIUM}
    pattern-either:
      - pattern: $EL.innerHTML = $VALUE
      - pattern: $EL.outerHTML = $VALUE
      - pattern: $EL.insertAdjacentHTML(..., $VALUE)
      - pattern: document.write($VALUE)
      - pattern: document.writeln($VALUE)

  - id: audit-eval-family
    languages: [javascript, typescript]
    severity: ERROR
    message: "Dynamic code execution detected. Never pass untrusted input to eval/Function."
    metadata: {category: security, cwe: "CWE-95", confidence: HIGH}
    pattern-either:
      - pattern: eval($VALUE)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: audit-string-timers
    languages: [javascript, typescript]
    severity: WARNING
    message: "String-based timer executes code. Pass a function instead of a string."
    metadata: {category: security, cwe: "CWE-95", confidence: HIGH}
    pattern-either:
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)

  - id: audit-hardcoded-secrets
    languages: [generic]
    severity: ERROR
    message: "Possible hardcoded credential. Move it to a secret store/environment variable and rotate it if committed."
    metadata: {category: secrets, cwe: "CWE-798", confidence: MEDIUM}
    pattern-regex: "(?i)\\b(api[_-]?key|secret|access[_-]?token|auth[_-]?token|password|passwd|client[_-]?secret)\\b[\\"'\\s:=]{1,8}[\\"'][A-Za-z0-9_./+\\-=]{16,}[\\"']"

  - id: audit-provider-tokens
    languages: [generic]
    severity: ERROR
    message: "Possible provider credential/token found in source. Remove it from source/history and rotate it."
    metadata: {category: secrets, cwe: "CWE-798", confidence: HIGH}
    pattern-regex: "(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})"

  - id: audit-private-key
    languages: [generic]
    severity: ERROR
    message: "Private-key material found in source. Remove it from Git history and rotate/revoke the key."
    metadata: {category: secrets, cwe: "CWE-321", confidence: HIGH}
    pattern-regex: "-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----"

  - id: audit-postmessage-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: "postMessage targetOrigin is '*'. Pin messages to an explicit trusted origin."
    metadata: {category: security, cwe: "CWE-346", confidence: HIGH}
    pattern: $X.postMessage($DATA, "*")

  - id: audit-message-listener
    languages: [javascript, typescript]
    severity: WARNING
    message: "message event handler found. Verify event.origin against an allowlist before trusting event.data."
    metadata: {category: security, cwe: "CWE-346", confidence: LOW}
    pattern-either:
      - pattern: window.addEventListener("message", $HANDLER, ...)
      - pattern: addEventListener("message", $HANDLER, ...)

  - id: audit-tls-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: "TLS certificate verification is disabled."
    metadata: {category: security, cwe: "CWE-295", confidence: HIGH}
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: audit-weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: "Weak hash algorithm used. MD5/SHA-1 are unsuitable for security-sensitive hashing."
    metadata: {category: security, cwe: "CWE-327", confidence: HIGH}
    pattern-either:
      - pattern: $CRYPTO.createHash("md5")
      - pattern: $CRYPTO.createHash("sha1")

  - id: audit-insecure-random
    languages: [javascript, typescript]
    severity: WARNING
    message: "Math.random() is not cryptographically secure; do not use it for security tokens or reset codes."
    metadata: {category: security, cwe: "CWE-338", confidence: LOW}
    pattern: Math.random()

  - id: audit-token-in-webstorage
    languages: [javascript, typescript]
    severity: WARNING
    message: "Credential-like data appears to be stored in Web Storage, which is readable by JavaScript running in the page."
    metadata: {category: security, cwe: "CWE-922", confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, $VALUE)
          - pattern: sessionStorage.setItem($KEY, $VALUE)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|secret|api.?key|password|auth|session).*

  - id: audit-cors-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: "Wildcard CORS origin found. Confirm that public cross-origin access is intentional."
    metadata: {category: security, cwe: "CWE-942", confidence: MEDIUM}
    pattern-either:
      - pattern: 'cors({..., origin: "*", ...})'
      - pattern: $RES.setHeader("Access-Control-Allow-Origin", "*")
      - pattern: $RES.header("Access-Control-Allow-Origin", "*")

  - id: audit-cookie-no-options
    languages: [javascript, typescript]
    severity: WARNING
    message: "Cookie set without visible security options. Review httpOnly, secure, and sameSite."
    metadata: {category: security, cwe: "CWE-614", confidence: LOW}
    pattern: $RES.cookie($NAME, $VALUE)

  - id: audit-node-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: "Shell command execution found. Avoid shell execution when possible and never interpolate untrusted input."
    metadata: {category: security, cwe: "CWE-78", confidence: MEDIUM}
    pattern-either:
      - pattern: child_process.exec($CMD, ...)
      - pattern: child_process.execSync($CMD, ...)
      - pattern: $CP.exec($CMD, ...)
      - pattern: $CP.execSync($CMD, ...)

  - id: audit-dangerous-deserialization
    languages: [javascript, typescript]
    severity: WARNING
    message: "Potentially dangerous deserialization API. Never deserialize untrusted data with unsafe serializers."
    metadata: {category: security, cwe: "CWE-502", confidence: MEDIUM}
    pattern-either:
      - pattern: serialize.unserialize($DATA)
      - pattern: nodeSerialize.unserialize($DATA)
      - pattern: $SERIALIZER.unserialize($DATA)

  # ========================= TAINT AUDIT =========================

  - id: audit-tainted-browser-xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: "Browser-controlled input appears to reach an HTML execution sink."
    metadata: {category: security, cwe: "CWE-79", confidence: HIGH}
    pattern-sources:
      - pattern-either:
          - pattern: location.hash
          - pattern: location.search
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: window.name
          - pattern: $PARAMS.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: $PURIFY.sanitize(...)
    pattern-sinks:
      - pattern-either:
          - pattern: $EL.innerHTML = $SINK
          - pattern: $EL.outerHTML = $SINK
          - pattern: $EL.insertAdjacentHTML(..., $SINK)
          - pattern: document.write($SINK)

  - id: audit-tainted-express-redirect
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: "Request-controlled input appears to reach a redirect. Validate the destination against a strict allowlist."
    metadata: {category: security, cwe: "CWE-601", confidence: HIGH}
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$X
          - pattern: $REQ.query[$X]
          - pattern: $REQ.body.$X
          - pattern: $REQ.body[$X]
          - pattern: $REQ.params.$X
          - pattern: $REQ.params[$X]
    pattern-sinks:
      - pattern: $RES.redirect($SINK)

  - id: audit-tainted-server-ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: "Request-controlled data appears to determine an outbound URL. Validate scheme and host against an allowlist."
    metadata: {category: security, cwe: "CWE-918", confidence: MEDIUM}
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$X
          - pattern: $REQ.query[$X]
          - pattern: $REQ.body.$X
          - pattern: $REQ.body[$X]
          - pattern: $REQ.params.$X
          - pattern: $REQ.params[$X]
    pattern-sinks:
      - pattern-either:
          - pattern: fetch($SINK, ...)
          - pattern: axios.get($SINK, ...)
          - pattern: axios.post($SINK, ...)
          - pattern: $HTTP.get($SINK, ...)
          - pattern: $HTTPS.get($SINK, ...)

  - id: audit-tainted-command-exec
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: "Request-controlled input appears to reach shell execution."
    metadata: {category: security, cwe: "CWE-78", confidence: HIGH}
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$X
          - pattern: $REQ.query[$X]
          - pattern: $REQ.body.$X
          - pattern: $REQ.body[$X]
          - pattern: $REQ.params.$X
          - pattern: $REQ.params[$X]
    pattern-sinks:
      - pattern-either:
          - pattern: child_process.exec($SINK, ...)
          - pattern: child_process.execSync($SINK, ...)
          - pattern: $CP.exec($SINK, ...)
          - pattern: $CP.execSync($SINK, ...)
# ========================= DEEP SURFACE INVENTORY =========================

  # ---- Filesystem / local paths ----

  - id: extract-fs-read-path
    languages: [javascript, typescript]
    severity: INFO
    message: "Filesystem read/open path -> $PATH"
    metadata: {category: paths, surface: filesystem, confidence: HIGH}
    pattern-either:
      - pattern: fs.readFile($PATH, ...)
      - pattern: fs.readFileSync($PATH, ...)
      - pattern: fs.open($PATH, ...)
      - pattern: fs.openSync($PATH, ...)
      - pattern: fs.createReadStream($PATH, ...)
      - pattern: $FS.readFile($PATH, ...)
      - pattern: $FS.readFileSync($PATH, ...)
      - pattern: $FS.createReadStream($PATH, ...)

  - id: extract-fs-write-path
    languages: [javascript, typescript]
    severity: INFO
    message: "Filesystem write/create path -> $PATH"
    metadata: {category: paths, surface: filesystem, confidence: HIGH}
    pattern-either:
      - pattern: fs.writeFile($PATH, ...)
      - pattern: fs.writeFileSync($PATH, ...)
      - pattern: fs.appendFile($PATH, ...)
      - pattern: fs.appendFileSync($PATH, ...)
      - pattern: fs.createWriteStream($PATH, ...)
      - pattern: $FS.writeFile($PATH, ...)
      - pattern: $FS.writeFileSync($PATH, ...)
      - pattern: $FS.createWriteStream($PATH, ...)

  - id: extract-fs-delete-move-path
    languages: [javascript, typescript]
    severity: INFO
    message: "Filesystem delete/move path operation"
    metadata: {category: paths, surface: filesystem, confidence: HIGH}
    pattern-either:
      - pattern: fs.unlink($PATH, ...)
      - pattern: fs.unlinkSync($PATH, ...)
      - pattern: fs.rm($PATH, ...)
      - pattern: fs.rmSync($PATH, ...)
      - pattern: fs.rename($FROM, $TO, ...)
      - pattern: fs.renameSync($FROM, $TO, ...)
      - pattern: $FS.unlink($PATH, ...)
      - pattern: $FS.rm($PATH, ...)
      - pattern: $FS.rename($FROM, $TO, ...)

  - id: extract-path-construction
    languages: [javascript, typescript]
    severity: INFO
    message: "Path construction -> $METHOD(...)"
    metadata: {category: paths, surface: filesystem, confidence: HIGH}
    patterns:
      - pattern: $PATH.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(join|resolve|normalize|relative|dirname|basename)$

  - id: extract-runtime-root-path
    languages: [javascript, typescript]
    severity: INFO
    message: "Runtime/root path reference"
    metadata: {category: paths, surface: filesystem, confidence: HIGH}
    pattern-either:
      - pattern: __dirname
      - pattern: __filename
      - pattern: process.cwd()
      - pattern: import.meta.url

  - id: extract-express-file-delivery
    languages: [javascript, typescript]
    severity: INFO
    message: "HTTP file delivery path -> $PATH"
    metadata: {category: paths, surface: http-files, confidence: HIGH}
    pattern-either:
      - pattern: $RES.sendFile($PATH, ...)
      - pattern: $RES.download($PATH, ...)
      - pattern: $RES.attachment($PATH, ...)

  - id: extract-static-directory
    languages: [javascript, typescript]
    severity: INFO
    message: "Static content directory exposed -> $PATH"
    metadata: {category: paths, surface: http-files, confidence: HIGH}
    pattern-either:
      - pattern: express.static($PATH, ...)
      - pattern: $EXPRESS.static($PATH, ...)

  - id: extract-upload-destination
    languages: [javascript, typescript]
    severity: INFO
    message: "Upload/storage destination configuration found"
    metadata: {category: paths, surface: uploads, confidence: MEDIUM}
    pattern-either:
      - pattern: multer({..., dest: $PATH, ...})
      - pattern: multer.diskStorage({..., destination: $DEST, ...})
      - pattern: $MULTER({..., dest: $PATH, ...})

  # ---- Routes / URL paths ----

  - id: extract-router-routes
    languages: [javascript, typescript]
    severity: INFO
    message: "Router endpoint: $METHOD $PATH"
    metadata: {category: routes, surface: http-routes, confidence: HIGH}
    patterns:
      - pattern: $ROUTER.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|all|options|head|use)$

  - id: extract-navigation-targets
    languages: [javascript, typescript]
    severity: INFO
    message: "Browser navigation/redirect target -> $URL"
    metadata: {category: routes, surface: browser-navigation, confidence: HIGH}
    pattern-either:
      - pattern: window.location.href = $URL
      - pattern: location.href = $URL
      - pattern: window.location.assign($URL)
      - pattern: window.location.replace($URL)
      - pattern: $RES.redirect($URL)

  # ---- IP / proxy / network identity handling ----

  - id: extract-ipv4-literal
    languages: [generic]
    severity: INFO
    message: "IPv4 literal found"
    metadata: {category: ip, surface: network-addresses, confidence: MEDIUM}
    pattern-regex: "\\b(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\b"

  - id: extract-ipv6-literal
    languages: [generic]
    severity: INFO
    message: "IPv6-style literal found"
    metadata: {category: ip, surface: network-addresses, confidence: LOW}
    pattern-regex: "\\b(?:[0-9A-Fa-f]{1,4}:){2,7}[0-9A-Fa-f]{1,4}\\b"

  - id: extract-private-loopback-ip
    languages: [generic]
    severity: INFO
    message: "Private/loopback IPv4 address found"
    metadata: {category: ip, surface: private-network, confidence: HIGH}
    pattern-regex: "\\b(?:10\\.(?:[0-9]{1,3}\\.){2}[0-9]{1,3}|192\\.168\\.[0-9]{1,3}\\.[0-9]{1,3}|172\\.(?:1[6-9]|2[0-9]|3[01])\\.[0-9]{1,3}\\.[0-9]{1,3}|127\\.(?:[0-9]{1,3}\\.){2}[0-9]{1,3})\\b"

  - id: extract-client-ip-api
    languages: [javascript, typescript]
    severity: INFO
    message: "Client/peer IP source read"
    metadata: {category: ip, surface: client-ip, confidence: HIGH}
    pattern-either:
      - pattern: $REQ.ip
      - pattern: $REQ.ips
      - pattern: $REQ.socket.remoteAddress
      - pattern: $REQ.connection.remoteAddress
      - pattern: $SOCKET.remoteAddress

  - id: extract-forwarded-client-ip-header
    languages: [javascript, typescript]
    severity: INFO
    message: "Proxy/client-IP header read -> $HEADER"
    metadata: {category: ip, surface: client-ip, confidence: HIGH}
    pattern-either:
      - pattern: $REQ.headers[$HEADER]
      - pattern: $REQ.get($HEADER)
      - pattern: $REQ.header($HEADER)
    metavariable-regex:
      metavariable: $HEADER
      regex: (?i)^["']?(x-forwarded-for|x-real-ip|cf-connecting-ip|true-client-ip|forwarded|fastly-client-ip|x-client-ip)["']?$

  - id: audit-trust-proxy-all
    languages: [javascript, typescript]
    severity: WARNING
    message: "Express trust proxy is broadly enabled. Verify requests can only arrive through trusted proxies before using forwarded client-IP/protocol data."
    metadata: {category: ip, surface: proxy-trust, cwe: "CWE-441", confidence: MEDIUM}
    pattern-either:
      - pattern: $APP.set("trust proxy", true)
      - pattern: $APP.enable("trust proxy")

  - id: audit-bind-all-interfaces
    languages: [javascript, typescript]
    severity: WARNING
    message: "Service appears to bind to all IPv4 interfaces (0.0.0.0). Confirm network exposure is intentional and protected."
    metadata: {category: network, surface: listeners, confidence: HIGH}
    pattern-either:
      - pattern: $APP.listen($PORT, "0.0.0.0", ...)
      - pattern: $SERVER.listen($PORT, "0.0.0.0", ...)
      - pattern: $NET.createServer(...).listen($PORT, "0.0.0.0", ...)

  - id: extract-network-listener
    languages: [javascript, typescript]
    severity: INFO
    message: "Network listener/bind found"
    metadata: {category: network, surface: listeners, confidence: HIGH}
    pattern-either:
      - pattern: $APP.listen($PORT, ...)
      - pattern: $SERVER.listen($PORT, ...)
      - pattern: $SOCKET.bind($PORT, ...)
      - pattern: $SOCKET.connect($PORT, $HOST, ...)

  - id: extract-dns-resolution
    languages: [javascript, typescript]
    severity: INFO
    message: "DNS/hostname resolution call -> $HOST"
    metadata: {category: network, surface: dns, confidence: HIGH}
    pattern-either:
      - pattern: dns.lookup($HOST, ...)
      - pattern: dns.resolve($HOST, ...)
      - pattern: $DNS.lookup($HOST, ...)
      - pattern: $DNS.resolve($HOST, ...)

  # ---- Encryption / cryptography ----

  - id: extract-encryption
    languages: [javascript, typescript]
    severity: INFO
    message: "Encryption operation -> createCipheriv($ALG, ...)"
    metadata: {category: crypto, surface: encryption, confidence: HIGH}
    pattern: $CRYPTO.createCipheriv($ALG, $KEY, $IV, ...)

  - id: extract-decryption
    languages: [javascript, typescript]
    severity: INFO
    message: "Decryption operation -> createDecipheriv($ALG, ...)"
    metadata: {category: crypto, surface: encryption, confidence: HIGH}
    pattern: $CRYPTO.createDecipheriv($ALG, $KEY, $IV, ...)

  - id: extract-webcrypto-encryption
    languages: [javascript, typescript]
    severity: INFO
    message: "Web Crypto operation found"
    metadata: {category: crypto, surface: webcrypto, confidence: HIGH}
    pattern-either:
      - pattern: $CRYPTO.subtle.encrypt($ALG, $KEY, $DATA)
      - pattern: $CRYPTO.subtle.decrypt($ALG, $KEY, $DATA)
      - pattern: $CRYPTO.subtle.digest($ALG, $DATA)
      - pattern: $CRYPTO.subtle.sign($ALG, $KEY, $DATA)
      - pattern: $CRYPTO.subtle.verify($ALG, $KEY, $SIG, $DATA)
      - pattern: crypto.subtle.encrypt($ALG, $KEY, $DATA)
      - pattern: crypto.subtle.decrypt($ALG, $KEY, $DATA)
      - pattern: crypto.subtle.digest($ALG, $DATA)

  - id: extract-key-derivation
    languages: [javascript, typescript]
    severity: INFO
    message: "Password/key derivation operation found"
    metadata: {category: crypto, surface: key-derivation, confidence: HIGH}
    pattern-either:
      - pattern: $CRYPTO.pbkdf2(...)
      - pattern: $CRYPTO.pbkdf2Sync(...)
      - pattern: $CRYPTO.scrypt(...)
      - pattern: $CRYPTO.scryptSync(...)
      - pattern: $CRYPTO.hkdf(...)
      - pattern: $CRYPTO.hkdfSync(...)

  - id: extract-secure-random
    languages: [javascript, typescript]
    severity: INFO
    message: "Cryptographically secure random generation found"
    metadata: {category: crypto, surface: random, confidence: HIGH}
    pattern-either:
      - pattern: $CRYPTO.randomBytes(...)
      - pattern: $CRYPTO.randomFill(...)
      - pattern: $CRYPTO.randomFillSync(...)
      - pattern: $CRYPTO.randomUUID(...)
      - pattern: crypto.getRandomValues(...)

  - id: extract-signing-verification
    languages: [javascript, typescript]
    severity: INFO
    message: "Cryptographic signing/verification operation found"
    metadata: {category: crypto, surface: signatures, confidence: HIGH}
    pattern-either:
      - pattern: $CRYPTO.createSign(...)
      - pattern: $CRYPTO.createVerify(...)
      - pattern: $CRYPTO.sign(...)
      - pattern: $CRYPTO.verify(...)
      - pattern: $JWT.sign(...)
      - pattern: $JWT.verify(...)

  - id: extract-tls-context
    languages: [javascript, typescript]
    severity: INFO
    message: "TLS/HTTPS configuration found"
    metadata: {category: crypto, surface: tls, confidence: HIGH}
    pattern-either:
      - pattern: https.createServer($OPTIONS, ...)
      - pattern: tls.createServer($OPTIONS, ...)
      - pattern: new https.Agent($OPTIONS)
      - pattern: new $HTTPS.Agent($OPTIONS)

  - id: audit-deprecated-cipher-api
    languages: [javascript, typescript]
    severity: ERROR
    message: "Deprecated password-based createCipher/createDecipher API found. Use createCipheriv/createDecipheriv with a securely generated key and IV."
    metadata: {category: crypto, surface: encryption, cwe: "CWE-327", confidence: HIGH}
    pattern-either:
      - pattern: $CRYPTO.createCipher(...)
      - pattern: $CRYPTO.createDecipher(...)

  - id: audit-ecb-mode
    languages: [javascript, typescript]
    severity: ERROR
    message: "ECB block-cipher mode detected. ECB leaks plaintext structure; use an authenticated mode such as AES-GCM where appropriate."
    metadata: {category: crypto, surface: encryption, cwe: "CWE-327", confidence: HIGH}
    patterns:
      - pattern-either:
          - pattern: $CRYPTO.createCipheriv($ALG, ...)
          - pattern: $CRYPTO.createDecipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i).*ecb.*

  - id: audit-static-zero-iv
    languages: [javascript, typescript]
    severity: WARNING
    message: "Encryption IV appears static/all-zero. IV/nonce reuse can break confidentiality or authenticity depending on the cipher mode."
    metadata: {category: crypto, surface: encryption, cwe: "CWE-329", confidence: MEDIUM}
    pattern-either:
      - pattern: $CRYPTO.createCipheriv($ALG, $KEY, Buffer.alloc($N, 0), ...)
      - pattern: $CRYPTO.createCipheriv($ALG, $KEY, Buffer.alloc($N), ...)
      - pattern: $CRYPTO.createCipheriv($ALG, $KEY, "0000000000000000", ...)

